<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Mount Waverley Smart Clock</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  body { -webkit-user-select:none; user-select:none; }
  .screen {
    min-height: 100vh; min-height: -webkit-fill-available;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 4vh 5vw;
  }
  #time {
    font-size: clamp(78px, 24vw, 210px);
    line-height: .9; font-weight: 200; letter-spacing: -0.06em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #date {
    margin-top: 2.6vh; font-size: clamp(18px, 4.4vw, 34px);
    font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    opacity: .82; text-align:center;
  }
  .weather {
    margin-top: 5vh; display:flex; align-items:center; justify-content:center;
    gap: 3vw; width:100%;
  }
  #icon { font-size: clamp(48px, 11vw, 88px); line-height:1; }
  .weatherText { display:flex; flex-direction:column; min-width:0; }
  .weatherTop { display:flex; align-items:baseline; gap: 2.5vw; }
  #temp { font-size: clamp(42px, 10vw, 82px); font-weight:300; line-height:1; }
  #condition { font-size: clamp(17px, 4vw, 30px); opacity:.9; white-space:nowrap; }
  #details {
    margin-top: 1.2vh; font-size: clamp(14px, 3.2vw, 24px);
    opacity:.62; white-space:nowrap;
  }
  #status {
    position:fixed; bottom: max(10px, env(safe-area-inset-bottom));
    left:0; right:0; text-align:center; font-size:12px; opacity:.32;
  }
  @media (orientation: landscape) {
    .screen { flex-direction:row; justify-content:space-evenly; padding: 3vh 5vw; }
    .clockBlock { width:58%; text-align:center; }
    #time { font-size: min(25vw, 38vh); }
    #date { font-size: min(3.2vw, 5vh); }
    .weather { width:38%; margin-top:0; gap:2vw; }
    #icon { font-size:min(8vw, 18vh); }
    #temp { font-size:min(7vw, 16vh); }
    #condition { font-size:min(2.6vw, 5vh); }
    #details { font-size:min(2vw, 3.8vh); }
  }
</style>
</head>
<body>
<div class="screen">
  <div class="clockBlock">
    <div id="time">--:--</div>
    <div id="date">Loading…</div>
  </div>
  <div class="weather">
    <div id="icon">◌</div>
    <div class="weatherText">
      <div class="weatherTop">
        <span id="temp">--°</span>
        <span id="condition">Loading weather</span>
      </div>
      <div id="details">Mount Waverley · H --° · L --°</div>
    </div>
  </div>
</div>
<div id="status"></div>

<script>
(function () {
  var timeEl = document.getElementById("time");
  var dateEl = document.getElementById("date");
  var statusEl = document.getElementById("status");

  function pad(n){ return n < 10 ? "0"+n : ""+n; }

  function updateClock(){
    var d = new Date();
    timeEl.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    try {
      dateEl.textContent = d.toLocaleDateString("en-AU", {
        weekday:"long", day:"numeric", month:"long"
      });
    } catch(e) {
      var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      var months=["January","February","March","April","May","June","July","August","September","October","November","December"];
      dateEl.textContent = days[d.getDay()]+" · "+d.getDate()+" "+months[d.getMonth()];
    }
  }
  updateClock();
  setInterval(updateClock, 1000);

  var codes = {
    0:["☀️","Clear"],
    1:["🌤️","Mainly clear"], 2:["⛅","Partly cloudy"], 3:["☁️","Overcast"],
    45:["🌫️","Fog"], 48:["🌫️","Fog"],
    51:["🌦️","Light drizzle"], 53:["🌦️","Drizzle"], 55:["🌧️","Heavy drizzle"],
    56:["🌧️","Freezing drizzle"], 57:["🌧️","Freezing drizzle"],
    61:["🌦️","Light rain"], 63:["🌧️","Rain"], 65:["🌧️","Heavy rain"],
    66:["🌧️","Freezing rain"], 67:["🌧️","Freezing rain"],
    71:["🌨️","Light snow"], 73:["🌨️","Snow"], 75:["❄️","Heavy snow"], 77:["❄️","Snow grains"],
    80:["🌦️","Rain showers"], 81:["🌧️","Rain showers"], 82:["⛈️","Heavy showers"],
    85:["🌨️","Snow showers"], 86:["🌨️","Heavy snow showers"],
    95:["⛈️","Thunderstorm"], 96:["⛈️","Thunderstorm"], 99:["⛈️","Thunderstorm"]
  };

  function showWeather(data, cached){
    if (!data || !data.current || !data.daily) return;
    var c = data.current.weather_code;
    var w = codes[c] || ["🌡️","Weather"];
    document.getElementById("icon").textContent = w[0];
    document.getElementById("condition").textContent = w[1];
    document.getElementById("temp").textContent = Math.round(data.current.temperature_2m) + "°";
    document.getElementById("details").textContent =
      "Mount Waverley · H " + Math.round(data.daily.temperature_2m_max[0]) +
      "° · L " + Math.round(data.daily.temperature_2m_min[0]) + "°";
    statusEl.textContent = cached ? "Offline · showing last weather" : "";
  }

  function loadWeather(){
    // Fixed Mount Waverley-area coordinates: avoids GPS permission prompts.
    var url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=-37.88&longitude=145.13" +
      "&current=temperature_2m,weather_code" +
      "&daily=temperature_2m_max,temperature_2m_min" +
      "&timezone=Australia%2FMelbourne&forecast_days=1";

    fetch(url, {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("weather"); return r.json(); })
      .then(function(data){
        showWeather(data, false);
        try { localStorage.setItem("smartClockWeather", JSON.stringify(data)); } catch(e){}
      })
      .catch(function(){
        try {
          var saved = localStorage.getItem("smartClockWeather");
          if(saved) showWeather(JSON.parse(saved), true);
          else {
            document.getElementById("condition").textContent = "Weather unavailable";
            statusEl.textContent = "Connect to Wi-Fi to load weather";
          }
        } catch(e){}
      });
  }

  loadWeather();
  setInterval(loadWeather, 15 * 60 * 1000);
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){ updateClock(); loadWeather(); }
  });
})();
</script>
</body>
</html>
