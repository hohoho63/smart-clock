<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<title>Mount Waverley Weather</title>
<style>
/* Dedicated iPhone 5c / iOS 10 landscape layout: 568 x 320 CSS px */
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;
  background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
#screen{
  position:absolute;left:0;top:0;width:100%;height:100%;
  text-align:center;background:#000;
}
#content{
  position:absolute;
  width:568px;height:280px;
  left:50%;top:50%;
  margin-left:-284px;
  margin-top:-140px;
}
#top{
  height:125px;line-height:125px;white-space:nowrap;text-align:center;
}
#icon{
  display:inline-block;
  width:90px;
  font-size:62px;
  line-height:125px;
  vertical-align:top;
  text-align:center;
}
#temp{
  display:inline-block;
  font-size:126px;
  line-height:115px;
  height:125px;
  font-weight:200;
  letter-spacing:-7px;
  vertical-align:top;
}
#desc{
  height:48px;line-height:48px;
  font-size:37px;font-weight:600;
  text-transform:uppercase;white-space:nowrap;
  text-align:center;
}
#place{
  margin-top:8px;height:34px;line-height:34px;
  font-size:28px;font-weight:400;opacity:.75;
}
#range{
  margin-top:2px;height:28px;line-height:28px;
  font-size:24px;font-weight:400;opacity:.58;
}
#status{
  position:absolute;bottom:2px;left:0;width:100%;
  text-align:center;font-size:9px;opacity:.25;
}
/* Portrait fallback */
@media screen and (orientation:portrait){
 #content{width:320px;height:360px;margin-left:-160px;margin-top:-180px}
 #top{height:145px;line-height:145px}
 #icon{width:75px;font-size:55px;line-height:145px}
 #temp{font-size:110px;line-height:135px;height:145px}
 #desc{font-size:29px;height:45px;line-height:45px}
 #place{font-size:24px}
 #range{font-size:21px}
}
</style>
</head>
<body>
<div id="screen">
 <div id="content">
  <div id="top"><span id="icon">🌤️</span><span id="temp">--°</span></div>
  <div id="desc">GETTING WEATHER…</div>
  <div id="place">Mount Waverley</div>
  <div id="range">H --° · L --°</div>
 </div>
 <div id="status"></div>
</div>
<script>
/* ES5 + XMLHttpRequest only, for iOS 10 Safari */
var wx={
0:["☀️","Clear"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],
45:["🌫️","Fog"],48:["🌫️","Fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],
56:["🌧️","Freezing drizzle"],57:["🌧️","Freezing drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],
65:["🌧️","Heavy rain"],66:["🌧️","Freezing rain"],67:["🌧️","Freezing rain"],71:["🌨️","Light snow"],
73:["🌨️","Snow"],75:["❄️","Heavy snow"],77:["❄️","Snow grains"],80:["🌦️","Rain showers"],
81:["🌧️","Rain showers"],82:["⛈️","Heavy showers"],85:["🌨️","Snow showers"],86:["🌨️","Heavy snow showers"],
95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm"],99:["⛈️","Thunderstorm"]
};

function render(x,offline){
 try{
  var c=x.current_weather.weathercode;
  var i=wx[c] || ["🌡️","Weather"];
  document.getElementById("icon").innerHTML=i[0];
  document.getElementById("temp").innerHTML=Math.round(x.current_weather.temperature)+"°";
  document.getElementById("desc").innerHTML=i[1];
  document.getElementById("range").innerHTML=
   "H "+Math.round(x.daily.temperature_2m_max[0])+"° &middot; L "+Math.round(x.daily.temperature_2m_min[0])+"°";
  document.getElementById("status").innerHTML=offline ? "Offline &middot; last saved weather" : "";
 }catch(e){}
}

function fallback(){
 try{
  var s=localStorage.getItem("clockwx");
  if(s){render(JSON.parse(s),true);}
  else{
   document.getElementById("desc").innerHTML="WEATHER UNAVAILABLE";
   document.getElementById("status").innerHTML="Wi-Fi needed for weather";
  }
 }catch(e){}
}

function weather(){
 var u="https://api.open-meteo.com/v1/forecast?latitude=-37.88&longitude=145.13&current_weather=true&daily=temperature_2m_max%2Ctemperature_2m_min&timezone=Australia%2FMelbourne&forecast_days=1";
 var r=new XMLHttpRequest();
 r.open("GET",u,true);
 r.onreadystatechange=function(){
  if(r.readyState===4){
   if(r.status>=200 && r.status<300){
    try{
     var data=JSON.parse(r.responseText);
     render(data,false);
     localStorage.setItem("clockwx",r.responseText);
    }catch(e){fallback();}
   }else{fallback();}
  }
 };
 r.onerror=fallback;
 try{r.send(null);}catch(e){fallback();}
}

weather();
setInterval(weather,900000);
document.addEventListener("visibilitychange",function(){
 if(!document.hidden){weather();}
},false);
</script>
</body>
</html>
