<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Mount Waverley Weather</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.top{display:flex;align-items:center;justify-content:center;gap:4vh;white-space:nowrap}
#icon{font-size:14vh;line-height:1} #temp{font-size:32vh;font-weight:250;line-height:.8;letter-spacing:-.06em}
#desc{margin-top:5vh;font-size:8vh;font-weight:600;text-transform:uppercase;white-space:nowrap}
#place{margin-top:2.5vh;font-size:6vh;opacity:.72} #range{margin-top:1.5vh;font-size:5vh;opacity:.55}
#status{position:fixed;bottom:4px;left:0;right:0;text-align:center;font-size:10px;opacity:.25}
</style></head><body><main>
<div class="top"><div id="icon">🌤️</div><div id="temp">--°</div></div>
<div id="desc">GETTING WEATHER…</div><div id="place">Mount Waverley</div><div id="range">H --° · L --°</div>
</main><div id="status"></div><script>
var wx={0:["☀️","Clear"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],45:["🌫️","Fog"],48:["🌫️","Fog"],51:["🌦️","Light drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Heavy drizzle"],61:["🌦️","Light rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],71:["🌨️","Light snow"],73:["🌨️","Snow"],75:["❄️","Heavy snow"],80:["🌦️","Rain showers"],81:["🌧️","Rain showers"],82:["⛈️","Heavy showers"],95:["⛈️","Thunderstorm"],96:["⛈️","Thunderstorm"],99:["⛈️","Thunderstorm"]};
function render(x,off){var c=x.current_weather.weathercode,i=wx[c]||["🌡️","Weather"];document.getElementById("icon").innerHTML=i[0];document.getElementById("temp").innerHTML=Math.round(x.current_weather.temperature)+"°";document.getElementById("desc").innerHTML=i[1];document.getElementById("range").innerHTML="H "+Math.round(x.daily.temperature_2m_max[0])+"° · L "+Math.round(x.daily.temperature_2m_min[0])+"°";document.getElementById("status").innerHTML=off?"Offline · last saved weather":""}
function fallback(){try{var s=localStorage.getItem("clockwx");if(s)render(JSON.parse(s),true)}catch(e){}}
function weather(){var u="https://api.open-meteo.com/v1/forecast?latitude=-37.88&longitude=145.13&current_weather=true&daily=temperature_2m_max%2Ctemperature_2m_min&timezone=Australia%2FMelbourne&forecast_days=1";var r=new XMLHttpRequest();r.open("GET",u,true);r.onreadystatechange=function(){if(r.readyState===4){if(r.status>=200&&r.status<300){try{render(JSON.parse(r.responseText),false);localStorage.setItem("clockwx",r.responseText)}catch(e){}}else fallback()}};r.onerror=fallback;try{r.send()}catch(e){fallback()}}
weather();setInterval(weather,900000);document.addEventListener("visibilitychange",function(){if(!document.hidden)weather()});
</script></body></html>
